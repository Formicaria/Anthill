# ANTHILL — docker-compose deployment.
#
# Default mode below uses network_mode: host, which is the closest container equivalent to
# "runs like it's installed directly on this machine": ANTHILL shares the host's network
# stack, so its auto-detected reachable IP (printed at startup and in GET /status) IS the
# host machine's real LAN IP, and a locally-running Ollama at http://localhost:11434 just
# works with no extra config. This only works on Linux Docker hosts (the common case for
# home-lab/production — Proxmox, bare Debian/Ubuntu, TrueNAS SCALE, etc.).
#
# Running on Windows or macOS (Docker Desktop)? host networking isn't supported there — see
# the bridge-mode alternative in docs/DEPLOYMENT.md, which publishes the port explicitly and
# reaches host services via host.docker.internal instead.

services:
  anthill:
    build: .
    image: anthill:latest
    container_name: anthill
    network_mode: "host"
    environment:
      # Uncomment to reach Ollama on a different machine, or to override the port ANTHILL binds:
      # - ANTHILL_OLLAMA_HOST=http://192.168.1.50:11434
      # - ANTHILL_PORT=8713
      #
      # Optional: a static bearer token for scripts/CI. Not required for normal use — the web
      # UI walks you through creating an admin account on first launch.
      # - ANTHILL_API_TOKEN=your-32-char-minimum-token-here
      - ANTHILL_HOST=0.0.0.0
    volumes:
      - anthill-data:/app/.anthill
      # Uncomment and point at a project directory to let the file ant read/propose patches
      # against real source on disk, then set agent_workspace_dir in .anthill/config.json to
      # match the path you mount it at below:
      # - /path/on/host/to/your/project:/workspace
    restart: unless-stopped

  # ── FORAGER — organizational knowledge (optional) ──────────────────────────────────────────
  #
  # Behind a PROFILE, so `docker compose up` is byte-for-byte what it was before this service
  # existed. You get FORAGER only by asking for it:
  #
  #     docker compose --profile knowledge up
  #
  # A second container is warranted here rather than preferred: FORAGER is a Node application
  # with its own SQLite database and its own ingestion pipeline, so there is no in-process
  # boundary to share with a .NET colony. See docs/FORAGER_INTEGRATION.md §3.1.
  #
  # Build context is a sibling checkout of https://github.com/Formicaria/Forager. Adjust the
  # path if yours lives elsewhere; there is no published image to pull.
  forager:
    profiles: ["knowledge"]
    build: ../forager
    image: forager:latest
    container_name: forager
    network_mode: "host"
    environment:
      - FORAGER_PORT=8790
      # LOOPBACK ONLY. FORAGER has no authentication of its own — it is designed to own its
      # local interface. Binding it to 0.0.0.0 publishes an unauthenticated knowledge base to
      # your network. Put a reverse proxy with auth in front before you change this.
      - FORAGER_HOST=127.0.0.1
      - FORAGER_DATA_DIR=/data
      # Directory import is refused unless this names the folders FORAGER may scan. Leaving it
      # empty is safe and means "uploads only" — it is not a missing setting.
      # - FORAGER_ALLOWED_INPUT_ROOTS=/corpus
    volumes:
      - forager-data:/data
      # Mount a corpus read-only and name it in FORAGER_ALLOWED_INPUT_ROOTS above to let the
      # colony index it. Read-only on purpose: ingestion never needs to write to its sources.
      # - /path/on/host/to/documents:/corpus:ro
    restart: unless-stopped

volumes:
  anthill-data:
  forager-data:
