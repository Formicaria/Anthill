name: CI

# Runs the checks nobody in this project's sandbox environment can run locally: a real .NET SDK
# build+test on Linux and Windows, a publish+selftest smoke test, a Docker build+boot smoke test,
# and a shellcheck pass on the LXC installer. Treat a green run here as the actual "does this
# work" signal for any change touching build/deploy — see docs/DEPLOYMENT.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (.NET, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Anthill.Modules.Micromound compiles against the MICROMOUND wire contract, which lives in
      # its own repository. $(MicromoundRepoPath) defaults to a sibling checkout — true on a dev
      # box, never true on a runner, so the runner is told where it actually put it.
      #
      # Pinned to a tag rather than floating on main: otherwise a commit to micromound can turn
      # this repository's CI red with nobody having touched this repository. Bump deliberately.
      - name: Check out the MICROMOUND wire contract
        uses: actions/checkout@v4
        with:
          repository: Formicaria/micromound
          ref: v0.1.0
          path: .micromound

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Anthill.sln -p:MicromoundRepoPath=${{ github.workspace }}/.micromound

      - name: Build (Release)
        run: dotnet build Anthill.sln -c Release --no-restore -p:MicromoundRepoPath=${{ github.workspace }}/.micromound

      - name: Test
        run: dotnet test Anthill.sln -c Release --no-build -p:MicromoundRepoPath=${{ github.workspace }}/.micromound --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/*.trx
          if-no-files-found: ignore

  publish-and-selftest:
    name: Publish + --selftest (linux-x64, self-contained)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish self-contained single-file (matches build.sh)
        run: |
          dotnet publish src/Anthill.Cli/Anthill.Cli.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=none \
            -o ./publish/linux-x64

      # v0.3.8.43: the Windows desktop shell builds here even though it only RUNS on Windows
      # (EnableWindowsTargeting). Outside Anthill.sln by the Anthill.UI rule, so this explicit
      # build is what keeps it compiling; DesktopShellTests pins this step's existence.
      - name: Build AnthillDesktop (win-x64 desktop shell, cross-targeted)
        run: |
          dotnet publish src/Anthill.Desktop/Anthill.Desktop.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=none \
            -o ./publish/win-x64-desktop

      - name: Run the framework self-test harness
        run: |
          chmod +x ./publish/linux-x64/anthill
          ANTHILL_API_TOKEN="ci-$(openssl rand -hex 24)" ./publish/linux-x64/anthill --selftest

      # Everything below only runs if publish + selftest succeeded (steps are sequential),
      # so a broken build can never produce a downloadable package.
      - name: Read version for artifact naming
        id: version
        run: |
          VERSION=$(grep -oP '(?<=public const string Version = ")[^"]+' src/Anthill.Core/Configuration/AnthillRuntime.cs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging as anthill-linux-x64-v$VERSION"

      - name: Package linux-x64 publish output
        run: |
          cp config.example.json README.md CHANGELOG.md ./publish/linux-x64/
          tar -czf "anthill-linux-x64-v${{ steps.version.outputs.version }}.tar.gz" -C ./publish/linux-x64 .

      - name: Upload linux-x64 package (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: anthill-linux-x64-v${{ steps.version.outputs.version }}
          path: anthill-linux-x64-v*.tar.gz
          if-no-files-found: error

  docker:
    name: Docker build + boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Build image
        run: docker build -t anthill:ci .

      - name: Boot the container (bridge mode, matches Windows/macOS docs)
        run: |
          docker run -d --name anthill-ci -p 8713:8713 anthill:ci

      - name: Wait for HEALTHCHECK to report healthy
        run: |
          status="starting"
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' anthill-ci 2>/dev/null || echo "starting")
            echo "  [$i/30] health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then
              echo "::error::Container reported unhealthy"
              docker logs anthill-ci
              exit 1
            fi
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            echo "::error::Container never became healthy within 60s"
            docker logs anthill-ci
            exit 1
          fi

      - name: Hit /health and confirm expected fields
        run: |
          curl -fsS http://localhost:8713/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json || (echo "::error::unexpected /health payload"; exit 1)

      - name: Dump container logs (always, for visibility)
        if: always()
        run: docker logs anthill-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f anthill-ci || true

  lint-lxc-installer:
    name: Shellcheck the LXC installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck deploy/lxc/setup.sh
        run: shellcheck deploy/lxc/setup.sh

      - name: bash -n syntax check (belt and suspenders)
        run: bash -n deploy/lxc/setup.sh

  ui-integrity:
    name: UI integrity (encoding + JS parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # An editor/tool in the pipeline has repeatedly re-saved the embedded UI as non-UTF-8,
      # flattening icon glyphs (carets/send/close/pheromone headers) to '?' and other glyphs to the
      # U+FFFD replacement char. Fail the build if any of that corruption is present so it can never
      # merge again. The one legitimate literal '?' — the <kbd>?</kbd> help-shortcut key — is allowed.
      - name: No UTF-8 glyph corruption in the console UI
        run: |
          python3 - <<'PY'
          import re, sys
          p = "src/Anthill.UI/index.html"
          s = open(p, encoding="utf-8").read()
          problems = []
          n = s.count("�")
          if n: problems.append(f"{n} U+FFFD replacement char(s) (‘�’)")
          bare = re.findall(r"(?<!<kbd)>\?<", s)          # bare >?< icons, excluding <kbd>?</kbd>
          if bare: problems.append(f"{len(bare)} bare '>?<' icon glyph(s) flattened to '?'")
          labeled = re.findall(r">\s*\?\s+[A-Z][a-z]", s)  # '>? Label' buttons
          if labeled: problems.append(f"{len(labeled)} '>? Label' button glyph(s)")
          t = s.count("'?':'?'")                            # caret ternaries det.open?'?':'?'
          if t: problems.append(f"{t} \"'?':'?'\" caret ternary(ies)")
          if problems:
              print(f"UI encoding corruption detected in {p}:")
              for x in problems: print("  -", x)
              print("These are flattened glyphs — re-save index.html as UTF-8 and restore the icons.")
              sys.exit(1)
          print("UI encoding OK: no flattened glyphs or replacement chars.")
          PY

      - name: Setup Node (for embedded-JS parse check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Embedded UI JavaScript parses cleanly
        run: |
          python3 - <<'PY'
          import re
          s = open("src/Anthill.UI/index.html", encoding="utf-8").read()
          blocks = [b for b in re.findall(r"<script\b[^>]*>(.*?)</script>", s, re.S) if b.strip()]
          open("/tmp/ui.js", "w", encoding="utf-8").write("\n;\n".join(blocks))
          PY
          node --check /tmp/ui.js

      # v2.17.1: behavioural coverage for the Missions conversation reconciler. node --test is
      # built into the Node 20 above; nothing is installed and no build pipeline is added.
      #
      # v0.3.8.52 — runs the DIRECTORY, not one named file. This step named mission-thread.test.js
      # alone, so navigation.test.js sat in the tree from v0.3.8.48 without ever running in CI: a
      # test file that is not enumerated is not a test, and nothing said so. Every tests/ui/*.test.js
      # is now picked up by existing, and adding one requires no CI edit to make it count.
      - name: UI logic tests (node --test)
        run: node --test tests/ui/

      # Plan/version consistency (v1.8.27, extended v1.8.28, repointed v3.8.24): the canonical plan must exist,
      # and every version marker must agree — runtime const, Directory.Build.props assembly version,
      # README, and CHANGELOG — so docs and binaries never drift from the code.
      - name: Docs + version consistency
        run: |
          python3 - <<'PY'
          import re, sys, os
          problems = []
          # v3.8.24: the canonical plan is docs/PLAN.md. NORTH_STAR, ROADMAP, REFACTOR-PLAN and
          # POST_REFACTOR-PLAN folded into it and are archived under docs/archive/v3/. This check is
          # why the consolidation had to touch CI: a green local test run would still have failed
          # here, on a file the suite no longer knows about.
          if not os.path.exists("docs/PLAN.md"):
              problems.append("docs/PLAN.md (the canonical plan) is missing")
          code = open("src/Anthill.Core/Configuration/AnthillRuntime.cs", encoding="utf-8").read()
          m = re.search(r'Version\s*=\s*"([^"]+)"', code)
          ver = m.group(1) if m else None
          readme = open("README.md", encoding="utf-8").read()
          rm = re.search(r"\*\*Current version:\*\*\s*v([0-9][0-9A-Za-z.\-]*)", readme)
          rver = rm.group(1) if rm else None
          if ver and rver and ver != rver:
              problems.append(f"README 'Current version: v{rver}' != runtime Version '{ver}'")
          props = open("Directory.Build.props", encoding="utf-8").read()
          pm = re.search(r"<AnthillVersion>([^<]+)</AnthillVersion>", props)
          pver = pm.group(1).strip() if pm else None
          if ver and pver and ver != pver:
              problems.append(f"Directory.Build.props AnthillVersion '{pver}' != runtime Version '{ver}'")
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          if ver and not re.search(r"^##\s+v" + re.escape(ver) + r"\b", changelog, re.M):
              problems.append(f"CHANGELOG.md has no '## v{ver}' entry for the runtime version")
          if problems:
              print("Docs/version consistency problems:")
              for x in problems: print("  -", x)
              sys.exit(1)
          print(f"Docs/version OK: NORTH_STAR present, README == props == CHANGELOG == runtime == v{ver}.")
          PY

  repo-guards:
    name: Repo guards (no stray Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NORTH_STAR §3.1 rule 13 / §4 guard 11: no active Python may exist in the repo.
      #
      # v3.8.17 (phase 7) — the companion "py.old is immutable on pull requests" job is gone with
      # the directory. It existed so an agent could not edit archived history; the archive was
      # deleted deliberately by the operator, which is a different act, and this job could not tell
      # the two apart. The history remains reachable in git.
      #
      # This half survives and is the one that mattered: the ban is on Python being ACTIVE in this
      # repository, and that is now a plain statement with no exception to carve out.
      - name: No Python files in the repo
        run: |
          stray=$(find . -name '*.py' -not -path './.git/*' -not -path '*/bin/*' -not -path '*/obj/*' || true)
          if [ -n "$stray" ]; then
            echo "::error::Active Python files found (forbidden by docs/PLAN.md):"
            echo "$stray"
            exit 1
          fi
          echo "No stray Python files."
